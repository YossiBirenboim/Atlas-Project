<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="CSS/style.css">
    <script defer type="module" src="./JS/app.js"></script>
</head>
<body>
    <header>
        <header>
            <nav class="navbar">
                <div class="logo">
                    <span id="id_logo" style="cursor: pointer;">Atlas</span>
                </div>
                <!-- <div class="hamburger-menu">&#9776;</div> -->
                <ul class="nav-links">
                    <li><a id="link_all">All</a></li>
                    <li><a id="link_i">Israel</a></li>
                    <li><a id="link_u">United States</a></li>
                    <li><a id="link_s">Switzerland</a></li>
                    <li><a id="link_c">Canada</a></li>
                    <li><a id="link_b">Brazil</a></li>
                </ul>
                <div class="nav-actions">
                    <select class="dropdown" id="id_select">
                        <option>Search a country</option>
                    </select>
                    <form class="search-form" id="id_form">
                        <input type="text" placeholder="Search" id="id_text">
                        <button type="submit">🔍</button>
                    </form>
                </div>
            </nav>
        </header>
    </header>
    <main id="id_main" class="container mainClass">

    </main>
    <footer>
